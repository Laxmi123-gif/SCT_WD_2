<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <!-- Makes the website responsive on mobile, tablet and desktop -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculator Web Application</title>

    <!-- Connect CSS file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculator">

        <!-- Calculator title -->
        <h1>Calculator</h1>

        <!-- Display -->
        <div class="display">
            <input
                type="text"
                id="display"
                value="0"
                readonly
            >
        </div>

        <!-- Error message -->
        <p id="error"></p>

        <!-- Calculator buttons -->
        <div class="buttons">

            <!-- First row -->
            <button class="special" onclick="clearDisplay()">AC</button>
            <button class="special" onclick="deleteLast()">DEL</button>
            <button class="operator" onclick="addToDisplay('%')">%</button>
            <button class="operator" onclick="addToDisplay('/')">÷</button>

            <!-- Second row -->
            <button onclick="addToDisplay('7')">7</button>
            <button onclick="addToDisplay('8')">8</button>
            <button onclick="addToDisplay('9')">9</button>
            <button class="operator" onclick="addToDisplay('*')">×</button>

            <!-- Third row -->
            <button onclick="addToDisplay('4')">4</button>
            <button onclick="addToDisplay('5')">5</button>
            <button onclick="addToDisplay('6')">6</button>
            <button class="operator" onclick="addToDisplay('-')">−</button>

            <!-- Fourth row -->
            <button onclick="addToDisplay('1')">1</button>
            <button onclick="addToDisplay('2')">2</button>
            <button onclick="addToDisplay('3')">3</button>
            <button class="operator" onclick="addToDisplay('+')">+</button>

            <!-- Fifth row -->
            <button class="zero" onclick="addToDisplay('0')">0</button>
            <button onclick="addToDisplay('.')">.</button>
            <button class="equal" onclick="calculate()">=</button>

        </div>

        <!-- Keyboard information -->
        <p class="keyboard-text">
            You can also use your keyboard
        </p>

    </div>

    <!-- Connect JavaScript file -->
    <script src="script.js"></script>

</body>

</html>
